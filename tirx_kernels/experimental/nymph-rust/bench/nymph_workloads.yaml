# Bench-suite workloads for the nymph GEMM kernels.
#
# Driven via bench/run_suite.py (the thin wrapper), or directly:
#   NYMPH_BENCH_SUITE=1 python -m tirx_kernels.bench_suite --workloads <this file>
# Registration: the repo-local bench/sitecustomize.py (auto-imported in every
# python with bench/ on its PYTHONPATH, incl. orchestrator workers) loads
# bench/_nymph_bench_autoreg.py under NYMPH_BENCH_SUITE=1.
workloads:
  - {kernel: nymph_nvfp4_gemm, config: 1024x1024x1024}
  - {kernel: nymph_nvfp4_gemm, config: 2048x2048x2048}
  - {kernel: nymph_nvfp4_gemm, config: 4096x4096x4096}
  - {kernel: nymph_nvfp4_gemm, config: 8192x8192x8192}
  - {kernel: nymph_nvfp4_gemm, config: 16384x16384x16384}
  - {kernel: nymph_fp16_bf16_gemm, config: fp16_1024x1024x1024}
  - {kernel: nymph_fp16_bf16_gemm, config: fp16_2048x2048x2048}
  - {kernel: nymph_fp16_bf16_gemm, config: fp16_4096x4096x4096}
  - {kernel: nymph_fp16_bf16_gemm, config: fp16_8192x8192x8192}
  - {kernel: nymph_fp16_bf16_gemm, config: fp16_16384x16384x16384}
  - {kernel: nymph_fp16_bf16_gemm, config: bf16_1024x1024x1024}
  - {kernel: nymph_fp16_bf16_gemm, config: bf16_2048x2048x2048}
  - {kernel: nymph_fp16_bf16_gemm, config: bf16_4096x4096x4096}
  - {kernel: nymph_fp16_bf16_gemm, config: bf16_8192x8192x8192}
  - {kernel: nymph_fp16_bf16_gemm, config: bf16_16384x16384x16384}
